name: Verify Processing Center UI Polish

on:
  workflow_run:
    workflows: [Build and Publish Docker Image]
    types: [completed]

permissions:
  contents: read
  packages: read

jobs:
  processing-center-ui-polish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout verified source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull verified image
        shell: bash
        run: |
          set -euo pipefail
          sha="${{ github.event.workflow_run.head_sha }}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/simkeeper:sha-${sha:0:7}"
          docker pull "$image"
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - name: Verify processing center source and runtime
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          container="simkeeper-processing-center-ui-smoke"
          base="http://127.0.0.1:18116"
          cookies="$tmp/cookies"
          password="$(openssl rand -hex 12)"
          expected_version="$(jq -r '.version' package.json)"

          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            rm -rf "$tmp"
          }
          trap cleanup EXIT

          fail() {
            echo "::error::$1"
            docker logs "$container" 2>&1 || true
            exit 1
          }

          grep -Fq 'data-processing-center-page="alpha.51.6"' 'src/app/(dashboard)/reminders/page.tsx' || fail "Processing center page marker missing"
          grep -Fq 'data-processing-center-header="alpha.51.6"' src/components/reminders/processing-center-header.tsx || fail "Processing center header marker missing"
          grep -Fq 'data-processing-center-summary="alpha.51.6"' src/components/reminders/processing-center-summary.tsx || fail "Processing center summary marker missing"
          grep -Fq 'data-processing-center-polish="alpha.51.6"' src/components/reminders/reminder-center-live.tsx || fail "Processing center live polish marker missing"
          grep -Fq 'data-processing-center-maintenance="alpha.51.6"' src/components/reminders/backup-attention-panel.tsx || fail "Maintenance panel marker missing"
          grep -Fq '[id^="task-"]' src/components/reminders/reminder-center-polish.module.css || fail "Task-card polish selector missing"
          grep -Fq "APP_VERSION = \"$expected_version\"" src/components/layout/navigation.ts || fail "App version does not match package version"

          mkdir -p "$tmp/data"
          docker run -d --name "$container" -p 18116:3000 \
            -e SIMKEEPER_COOKIE_SECURE=false \
            -e PUID="$(id -u)" -e PGID="$(id -g)" \
            -v "$tmp/data:/app/data" "$IMAGE" >/dev/null || fail "Unable to start SIMKeeper"

          ready=0
          for _ in $(seq 1 40); do
            if curl -fsS --max-time 2 "$base/api/health" >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          [ "$ready" -eq 1 ] || fail "SIMKeeper did not become healthy"

          curl -fsS -c "$cookies" -o /dev/null -X POST \
            --data-urlencode 'username=processinguismoke' \
            --data-urlencode "password=$password" \
            --data-urlencode "confirmPassword=$password" \
            "$base/api/auth/setup" || fail "Unable to create smoke administrator"

          curl -fsS -b "$cookies" "$base/reminders" > "$tmp/reminders.html" || fail "Processing center route failed"
          grep -Fq 'data-processing-center-page="alpha.51.6"' "$tmp/reminders.html" || fail "Processing center page polish missing at runtime"
          grep -Fq 'data-processing-center-header="alpha.51.6"' "$tmp/reminders.html" || fail "Processing center header missing at runtime"
          grep -Fq 'data-processing-center-summary="alpha.51.6"' "$tmp/reminders.html" || fail "Processing center summary missing at runtime"
          grep -Fq 'data-processing-center-polish="alpha.51.6"' "$tmp/reminders.html" || fail "Processing center live shell missing at runtime"
          grep -Fq '号码待处理' "$tmp/reminders.html" || fail "Processing center task section heading missing"
          grep -Fq '当前没有需要处理的任务' "$tmp/reminders.html" || fail "Processing center empty state missing"
          grep -Fq '记录活动' "$tmp/reminders.html" || fail "Processing center proactive activity action missing"

          echo "Processing center UI polish smoke test passed"
