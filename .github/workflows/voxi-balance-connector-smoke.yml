name: Verify VOXI Balance Connector

on:
  workflow_run:
    workflows:
      - Build and Publish Docker Image
    types:
      - completed

permissions:
  contents: read
  packages: read

jobs:
  voxi-balance-connector:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout verified source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull verified image
        shell: bash
        run: |
          set -euo pipefail
          sha="${{ github.event.workflow_run.head_sha }}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/simkeeper:sha-${sha:0:7}"
          docker pull "$image"
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - name: Verify VOXI Playwright Chromium integration
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          container="simkeeper-voxi-balance-smoke"
          base="http://127.0.0.1:18124"
          cookies="$tmp/cookies"
          fake_username='VOXI-SMOKE-USERNAME@example.invalid'
          fake_password='VOXI-SMOKE-PASSWORD-ONLY-FOR-CI'
          expected_version="$(jq -r '.version' package.json)"

          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            rm -rf "$tmp"
          }
          trap cleanup EXIT

          fail() {
            echo "::error::$1"
            docker logs "$container" 2>&1 || true
            exit 1
          }

          grep -Fq 'playwright-core' package.json || fail "playwright-core dependency missing"
          grep -Fq 'chromium' Dockerfile || fail "Chromium runtime package missing from Dockerfile"
          grep -Fq 'SIMKEEPER_VOXI_CHROMIUM_EXECUTABLE=/usr/local/bin/simkeeper-chromium' Dockerfile || fail "VOXI Chromium wrapper executable is not configured"
          grep -Fq 'SIMKEEPER_REAL_CHROMIUM_EXECUTABLE=/usr/bin/chromium' Dockerfile || fail "Real Chromium executable is not configured"
          grep -Fq 'COPY simkeeper-chromium.sh /usr/local/bin/simkeeper-chromium' Dockerfile || fail "VOXI Chromium wrapper is not copied into the image"
          grep -Fq 'providers/voxi-browser' src/lib/carrier-connectors/registry.ts || fail "VOXI browser provider is not active"
          grep -Fq 'id: "voxi"' src/lib/carrier-connectors/providers/voxi-browser.ts || fail "VOXI provider id missing"
          grep -Fq 'launchPersistentContext' src/lib/carrier-connectors/providers/voxi-browser.ts || fail "Persistent Chromium profile missing"
          grep -Fq 'page.evaluate' src/lib/carrier-connectors/providers/voxi-browser.ts || fail "VOXI API calls are not running inside Chromium"
          grep -Fq '"/authenticate/sendOtp"' src/lib/carrier-connectors/providers/voxi-browser.ts || fail "VOXI OTP endpoint missing"
          grep -Fq '"/auth/accounts"' src/lib/carrier-connectors/providers/voxi-browser.ts || fail "VOXI account discovery missing"
          grep -Fq '"/subscription/get"' src/lib/carrier-connectors/providers/voxi-browser.ts || fail "VOXI subscription balance endpoint missing"
          grep -Fq 'subscription.simBalance' src/lib/carrier-connectors/providers/voxi-browser.ts || fail "VOXI simBalance parser missing"
          grep -Fq 'carrier-browser' src/lib/carrier-connectors/providers/voxi-browser.ts || fail "VOXI persistent profile directory missing"
          grep -Fq 'key: "username"' src/lib/carrier-connectors/providers/voxi-browser.ts || fail "VOXI username credential missing"
          grep -Fq 'key: "password"' src/lib/carrier-connectors/providers/voxi-browser.ts || fail "VOXI password credential missing"
          grep -Fq 'key: "requestOtp"' src/lib/carrier-connectors/providers/voxi-browser.ts || fail "VOXI OTP request control missing"
          grep -Fq 'key: "otpCode"' src/lib/carrier-connectors/providers/voxi-browser.ts || fail "VOXI OTP code field missing"
          ! grep -Fq 'browserUserAgent' src/lib/carrier-connectors/providers/voxi-browser.ts || fail "Legacy manual User-Agent field should not be exposed"
          grep -Fq 'supportedCountryCodes: ["GB"]' 'src/app/api/sims/balance-source/route.ts' || fail "VOXI GB matcher missing"
          grep -Fq 'Playwright Chromium' 'src/app/api/sims/balance-source/route.ts' || fail "VOXI browser runtime guidance missing"
          grep -Fq "APP_VERSION = \"$expected_version\"" src/components/layout/navigation.ts || fail "App version does not match package version"

          mkdir -p "$tmp/data"
          docker run -d --name "$container" -p 18124:3000 \
            -e SIMKEEPER_COOKIE_SECURE=false \
            -e PUID="$(id -u)" -e PGID="$(id -g)" \
            -v "$tmp/data:/app/data" "$IMAGE" >/dev/null || fail "Unable to start SIMKeeper"

          ready=0
          for _ in $(seq 1 40); do
            if curl -fsS --max-time 2 "$base/api/health" >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          [ "$ready" -eq 1 ] || fail "SIMKeeper did not become healthy"

          docker exec "$container" test -x /usr/local/bin/simkeeper-chromium \
            || fail "VOXI Chromium wrapper is not executable inside the published image"
          docker exec "$container" /usr/bin/chromium --version >/dev/null 2>&1 \
            || fail "Chromium is not executable inside the published image"
          docker exec "$container" node -e "require('playwright-core');" >/dev/null 2>&1 \
            || fail "playwright-core is not available in the standalone runtime"

          curl -fsS -c "$cookies" -o /dev/null -X POST \
            --data-urlencode 'username=voxismoke' \
            --data-urlencode 'password=voxi-smoke-123' \
            --data-urlencode 'confirmPassword=voxi-smoke-123' \
            "$base/api/auth/setup" || fail "Unable to create smoke administrator"

          curl -fsS -b "$cookies" "$base/api/sims/balance-source" > "$tmp/providers.json" \
            || fail "Unable to list balance providers"
          [ "$(jq '[.providers[] | select(.id == "voxi" and .maturity == "experimental" and .runtimeReady == true and .capabilities.balance == true and .capabilities.automaticSync == true and .capabilities.accountStatus == true)] | length' "$tmp/providers.json")" = "1" ] \
            || fail "VOXI provider metadata is incomplete"
          for key in username password; do
            [ "$(jq --arg key "$key" '[.providers[] | select(.id == "voxi") | .credentialFields[] | select(.key == $key)] | length' "$tmp/providers.json")" = "1" ] \
              || fail "VOXI credential field $key is not exposed to the editor"
          done
          for key in requestOtp otpCode; do
            [ "$(jq --arg key "$key" '[.providers[] | select(.id == "voxi") | .configFields[] | select(.key == $key)] | length' "$tmp/providers.json")" = "1" ] \
              || fail "VOXI auth config field $key is not exposed to the editor"
          done

          curl -fsS -b "$cookies" -H 'Content-Type: application/json' \
            -d '{"name":"VOXI","countryCode":"GB","website":"https://www.voxi.co.uk","notes":""}' \
            "$base/api/carriers" > "$tmp/carrier.json" || fail "Unable to create VOXI carrier"
          carrier_id="$(jq -r '.carrier.id' "$tmp/carrier.json")"
          [ "$carrier_id" -gt 0 ] || fail "VOXI carrier id missing"

          jq -n --argjson carrierId "$carrier_id" '{
            label:"VOXI Smoke",phoneNumber:"+447700900123",carrierId:$carrierId,deviceId:null,
            simType:"esim",iccid:"",balance:0,currencyCode:"GBP",status:"active",
            activationDate:"",validUntil:"",identityStatus:"unknown",identityName:"",
            identityDocumentType:"",identityDocumentTypeCustom:"",identityDocumentNumber:"",
            identityCountryCode:"",identityNotes:"",notes:"",esimProfile:null
          }' > "$tmp/sim.json"
          curl -fsS -b "$cookies" -H 'Content-Type: application/json' --data-binary @"$tmp/sim.json" \
            "$base/api/sims" > "$tmp/sim-result.json" || fail "Unable to create VOXI SIM"
          sim_id="$(jq -r '.sim.id' "$tmp/sim-result.json")"
          [ "$sim_id" -gt 0 ] || fail "VOXI SIM id missing"

          jq -n \
            --argjson simId "$sim_id" \
            --arg username "$fake_username" \
            --arg password "$fake_password" '{
              simId:$simId,
              provider:"voxi",
              syncIntervalMinutes:1440,
              providerConfig:{requestOtp:false},
              credentials:{username:$username,password:$password}
            }' > "$tmp/source.json"
          code="$(curl -sS -b "$cookies" -o "$tmp/source-result.json" -w '%{http_code}' \
            -X PUT -H 'Content-Type: application/json' --data-binary @"$tmp/source.json" \
            "$base/api/sims/balance-source")"
          [ "$code" = "200" ] || fail "VOXI source configuration returned HTTP $code"
          [ "$(jq -r '.source.connector.provider' "$tmp/source-result.json")" = "voxi" ] \
            || fail "VOXI connector was not linked to SIM"
          [ "$(jq -r '.source.connector.hasCredentials' "$tmp/source-result.json")" = "true" ] \
            || fail "VOXI encrypted credential flag missing"

          sync
          for dbfile in "$tmp/data/simkeeper.db" "$tmp/data/simkeeper.db-wal" "$tmp/data/simkeeper.db-shm"; do
            [ -f "$dbfile" ] || continue
            ! grep -aFq "$fake_username" "$dbfile" || fail "VOXI username was stored in plaintext"
            ! grep -aFq "$fake_password" "$dbfile" || fail "VOXI password was stored in plaintext"
          done

          curl -fsS -b "$cookies" "$base/api/sims/balance-source?simId=$sim_id" > "$tmp/source-read.json" \
            || fail "Unable to read VOXI source"
          [ "$(jq -r '.source.connector.providerLabel' "$tmp/source-read.json")" = "VOXI My Account" ] \
            || fail "VOXI provider label missing from source"
          ! grep -Fq "$fake_username" "$tmp/source-read.json" || fail "VOXI username leaked through API"
          ! grep -Fq "$fake_password" "$tmp/source-read.json" || fail "VOXI password leaked through API"

          echo "VOXI Playwright Chromium connector smoke test passed"
