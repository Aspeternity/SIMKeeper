name: Verify Database Foundation

on:
  workflow_run:
    workflows:
      - Build and Publish Docker Image
    types:
      - completed

permissions:
  contents: read
  packages: read

jobs:
  database-foundation-smoke:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull current and alpha.46 images
        shell: bash
        run: |
          set -euo pipefail
          sha="${{ github.event.workflow_run.head_sha }}"
          short="${sha:0:7}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          current="ghcr.io/${owner}/simkeeper:sha-${short}"
          legacy="ghcr.io/${owner}/simkeeper:sha-8dabe33"
          docker pull "$current"
          docker pull "$legacy"
          echo "CURRENT_IMAGE=$current" >> "$GITHUB_ENV"
          echo "LEGACY_IMAGE=$legacy" >> "$GITHUB_ENV"

      - name: Verify alpha.46 upgrade, backup, idempotency, and fresh install
        shell: bash
        run: |
          set -euo pipefail

          container="simkeeper-database-foundation-smoke"
          tmp="$(mktemp -d)"
          legacy_data="$tmp/legacy-data"
          fresh_data="$tmp/fresh-data"
          base="http://127.0.0.1:18092"
          cookies="$tmp/cookies.txt"
          mkdir -p "$legacy_data" "$fresh_data"

          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            rm -rf "$tmp"
          }
          trap cleanup EXIT

          fail() {
            echo "::error::$1"
            docker logs "$container" 2>&1 || true
            for file in "$tmp"/*.json; do
              [ -f "$file" ] || continue
              echo "----- $file -----"
              cat "$file" || true
              echo
            done
            exit 1
          }

          start_container() {
            image="$1"
            data="$2"
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker run -d \
              --name "$container" \
              -p 18092:3000 \
              -e SIMKEEPER_COOKIE_SECURE=false \
              -e PUID="$(id -u)" \
              -e PGID="$(id -g)" \
              -v "$data:/app/data" \
              "$image" >/dev/null || fail "Unable to start SIMKeeper container"

            ready=0
            for _ in $(seq 1 45); do
              if curl -fsS --max-time 2 "$base/api/health" >/dev/null 2>&1; then
                ready=1
                break
              fi
              sleep 1
            done
            [ "$ready" -eq 1 ] || fail "SIMKeeper did not become healthy"
          }

          login() {
            rm -f "$cookies"
            status="$(curl -sS --max-time 10 -c "$cookies" -o /dev/null -w '%{http_code}' \
              -X POST \
              --data-urlencode 'username=migrationadmin' \
              --data-urlencode 'password=migration-test-123' \
              "$base/api/auth/login")" || fail "Login request failed"
            [ "$status" = "303" ] || fail "Login returned HTTP $status"
          }

          # Build a real alpha.46 database first. It predates formal migrations.
          start_container "$LEGACY_IMAGE" "$legacy_data"
          status="$(curl -sS --max-time 10 -c "$cookies" -o /dev/null -w '%{http_code}' \
            -X POST \
            --data-urlencode 'username=migrationadmin' \
            --data-urlencode 'password=migration-test-123' \
            --data-urlencode 'confirmPassword=migration-test-123' \
            "$base/api/auth/setup")" || fail "Legacy setup failed"
          [ "$status" = "303" ] || fail "Legacy setup returned HTTP $status"

          status="$(curl -sS --max-time 10 -b "$cookies" -o "$tmp/carrier.json" -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            --data '{"name":"Migration Smoke Carrier","countryCode":"PH","website":"","notes":"alpha.46 upgrade source"}' \
            "$base/api/carriers")" || fail "Legacy carrier creation failed"
          [ "$status" = "201" ] || fail "Legacy carrier creation returned HTTP $status"
          carrier_id="$(jq -r '.carrier.id // empty' "$tmp/carrier.json")"
          [ -n "$carrier_id" ] || fail "Legacy carrier id missing"

          jq -n --argjson carrierId "$carrier_id" '{
            label:"Alpha46 Migration SIM",
            phoneNumber:"+639171234567",
            carrierId:$carrierId,
            deviceId:null,
            simType:"physical",
            iccid:"",
            balance:88.5,
            currencyCode:"PHP",
            lowBalanceEnabled:false,
            lowBalanceThreshold:null,
            status:"active",
            activationDate:"2026-01-01",
            validUntil:"2027-01-01",
            identityStatus:"unknown",
            identityName:"",
            identityDocumentType:"",
            identityDocumentTypeCustom:"",
            identityDocumentNumber:"",
            identityCountryCode:"",
            identityNotes:"",
            notes:"database migration smoke"
          }' > "$tmp/sim-payload.json"
          status="$(curl -sS --max-time 10 -b "$cookies" -o "$tmp/sim.json" -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' --data-binary @"$tmp/sim-payload.json" \
            "$base/api/sims")" || fail "Legacy SIM creation failed"
          [ "$status" = "201" ] || fail "Legacy SIM creation returned HTTP $status"
          docker rm -f "$container" >/dev/null 2>&1 || true

          python3 - "$legacy_data/simkeeper.db" <<'PY'
          import sqlite3, sys
          db = sqlite3.connect(sys.argv[1])
          tables = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          columns = {row[1] for row in db.execute("PRAGMA table_info(users)")}
          assert "schema_migrations" not in tables, tables
          assert "remote_backup_runs" not in tables, tables
          assert "security_events" not in tables, tables
          assert "totp_enabled_at" not in columns, columns
          assert db.execute("SELECT COUNT(*) FROM users").fetchone()[0] == 1
          assert db.execute("SELECT label FROM sim_cards").fetchone()[0] == "Alpha46 Migration SIM"
          db.close()
          PY

          # First current start must snapshot the old DB and migrate it through schema v4.
          start_container "$CURRENT_IMAGE" "$legacy_data"
          login
          curl -fsS --max-time 10 -b "$cookies" "$base/api/system/database" > "$tmp/database-upgraded.json" \
            || fail "Database health endpoint failed after upgrade"
          [ "$(jq -r '.database.schemaVersion' "$tmp/database-upgraded.json")" = "4" ] || fail "Schema version is not v4 after upgrade"
          [ "$(jq -r '.database.expectedSchemaVersion' "$tmp/database-upgraded.json")" = "4" ] || fail "Expected schema version is not v4"
          [ "$(jq -r '.database.pendingMigrations | length' "$tmp/database-upgraded.json")" = "0" ] || fail "Pending migrations remain after upgrade"
          [ "$(jq -r '.database.quickCheck.status' "$tmp/database-upgraded.json")" = "ok" ] || fail "SQLite quick_check did not pass"
          [ "$(jq -r '.database.foreignKeyViolations' "$tmp/database-upgraded.json")" = "0" ] || fail "Foreign key violations detected"
          jq -e '[.database.migrations[].name] | index("alpha46_baseline") != null and index("query_index_audit") != null and index("remote_backup_runs") != null and index("two_factor_security") != null' \
            "$tmp/database-upgraded.json" >/dev/null || fail "Migration history is incomplete"
          [ "$(jq -r '.database.preMigrationBackups.count' "$tmp/database-upgraded.json")" -ge 1 ] || fail "Pre-migration backup was not created"

          curl -fsS --max-time 10 -b "$cookies" "$base/api/sims" > "$tmp/sims-after-upgrade.json" \
            || fail "SIM list failed after migration"
          jq -e '.sims | any(.label == "Alpha46 Migration SIM" and .balance == 88.5 and .validUntil == "2027-01-01")' \
            "$tmp/sims-after-upgrade.json" >/dev/null || fail "Legacy SIM data changed during migration"

          mapfile -t migration_backups < <(find "$legacy_data/backups" -maxdepth 1 -type f -name 'simkeeper-pre-migration-v0-to-v4-*.db' -print | sort)
          [ "${#migration_backups[@]}" -eq 1 ] || fail "Expected exactly one v0-to-v4 pre-migration backup"
          backup_db="${migration_backups[0]}"

          python3 - "$legacy_data/simkeeper.db" "$backup_db" <<'PY'
          import sqlite3, sys
          current = sqlite3.connect(sys.argv[1])
          backup = sqlite3.connect(sys.argv[2])
          tables = {row[0] for row in current.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          columns = {row[1] for row in current.execute("PRAGMA table_info(users)")}
          assert "security_events" in tables
          assert {"totp_secret_ciphertext", "totp_enabled_at", "totp_recovery_hashes"}.issubset(columns)
          assert current.execute("SELECT COUNT(*) FROM schema_migrations").fetchone()[0] == 4
          backup_tables = {row[0] for row in backup.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          assert "schema_migrations" not in backup_tables
          assert "security_events" not in backup_tables
          assert backup.execute("SELECT label FROM sim_cards").fetchone()[0] == "Alpha46 Migration SIM"
          current.close()
          backup.close()
          PY

          before_restart="$(find "$legacy_data/backups" -maxdepth 1 -type f -name 'simkeeper-pre-migration-*.db' | wc -l | tr -d ' ')"
          docker rm -f "$container" >/dev/null 2>&1 || true

          # Restart is idempotent and does not create a second migration snapshot.
          start_container "$CURRENT_IMAGE" "$legacy_data"
          login
          curl -fsS --max-time 10 -b "$cookies" "$base/api/system/database" > "$tmp/database-restarted.json" \
            || fail "Database health endpoint failed after restart"
          after_restart="$(find "$legacy_data/backups" -maxdepth 1 -type f -name 'simkeeper-pre-migration-*.db' | wc -l | tr -d ' ')"
          [ "$before_restart" = "$after_restart" ] || fail "Restart created an unnecessary migration backup"
          [ "$(jq -r '.database.schemaVersion' "$tmp/database-restarted.json")" = "4" ] || fail "Schema version changed after restart"
          [ "$(jq -r '.database.migrations | length' "$tmp/database-restarted.json")" = "4" ] || fail "Migration history was duplicated after restart"
          docker rm -f "$container" >/dev/null 2>&1 || true

          # A fresh current installation reaches v4 without an upgrade snapshot.
          start_container "$CURRENT_IMAGE" "$fresh_data"
          status="$(curl -sS --max-time 10 -c "$cookies" -o /dev/null -w '%{http_code}' \
            -X POST \
            --data-urlencode 'username=migrationadmin' \
            --data-urlencode 'password=migration-test-123' \
            --data-urlencode 'confirmPassword=migration-test-123' \
            "$base/api/auth/setup")" || fail "Fresh setup failed"
          [ "$status" = "303" ] || fail "Fresh setup returned HTTP $status"
          curl -fsS --max-time 10 -b "$cookies" "$base/api/system/database" > "$tmp/database-fresh.json" \
            || fail "Fresh database health endpoint failed"
          [ "$(jq -r '.database.schemaVersion' "$tmp/database-fresh.json")" = "4" ] || fail "Fresh database did not reach schema v4"
          [ "$(jq -r '.database.preMigrationBackups.count' "$tmp/database-fresh.json")" = "0" ] || fail "Fresh database created an unnecessary migration backup"
          [ "$(jq -r '.database.status' "$tmp/database-fresh.json")" = "healthy" ] || fail "Fresh database health is not healthy"

          echo "Database foundation smoke checks passed."
