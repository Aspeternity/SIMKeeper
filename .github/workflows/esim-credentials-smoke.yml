name: Verify eSIM Credential Archive

on:
  workflow_run:
    workflows:
      - Build and Publish Docker Image
    types:
      - completed

permissions:
  contents: read
  packages: read

jobs:
  esim-credentials-smoke:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull verified SIMKeeper image
        shell: bash
        run: |
          set -euo pipefail
          sha="${{ github.event.workflow_run.head_sha }}"
          short="${sha:0:7}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/simkeeper:sha-${short}"
          docker pull "$image"
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - name: Verify encrypted eSIM credentials and portable backup
        shell: bash
        run: |
          set -euo pipefail

          container="simkeeper-esim-credential-smoke"
          tmp="$(mktemp -d)"
          base="http://127.0.0.1:18086"
          cookies="$tmp/cookies.txt"
          activation="SMOKE-ACTIVATION-123"
          confirmation="SMOKE-CONFIRM-456"
          smdp="smoke.rsp.example"
          lpa="LPA:1\$${smdp}\$${activation}"

          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            rm -rf "$tmp"
          }
          trap cleanup EXIT

          fail() {
            echo "::error::$1"
            docker logs "$container" 2>&1 || true
            for file in "$tmp"/*.json; do
              [ -f "$file" ] || continue
              echo "----- $file -----"
              cat "$file" || true
              echo
            done
            exit 1
          }

          start_container() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker run -d \
              --name "$container" \
              -p 18086:3000 \
              -e SIMKEEPER_COOKIE_SECURE=false \
              -e PUID="$(id -u)" \
              -e PGID="$(id -g)" \
              -v "$tmp/data:/app/data" \
              "$IMAGE" >/dev/null || fail "Unable to start eSIM credential smoke container"
            ready=0
            for _ in $(seq 1 40); do
              if curl -fsS --max-time 2 "$base/api/health" >/dev/null 2>&1; then
                ready=1
                break
              fi
              sleep 1
            done
            [ "$ready" -eq 1 ] || fail "SIMKeeper did not become healthy"
          }

          mkdir -p "$tmp/data"
          start_container

          curl -fsS --max-time 10 -c "$cookies" -o /dev/null \
            -X POST \
            --data-urlencode 'username=smokeadmin' \
            --data-urlencode 'password=smoke-test-123' \
            --data-urlencode 'confirmPassword=smoke-test-123' \
            "$base/api/auth/setup" || fail "Unable to create smoke administrator"

          status="$(curl -sS --max-time 10 -b "$cookies" -o "$tmp/carrier.json" -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            --data '{"name":"Smoke eSIM Carrier","countryCode":"PH","website":"","notes":""}' \
            "$base/api/carriers")" || fail "Carrier creation failed"
          [ "$status" = "201" ] || fail "Carrier creation returned HTTP $status"
          carrier_id="$(jq -r '.carrier.id // empty' "$tmp/carrier.json")"
          [ -n "$carrier_id" ] || fail "Carrier id missing"

          jq -n \
            --argjson carrierId "$carrier_id" \
            --arg activation "$activation" \
            --arg confirmation "$confirmation" \
            --arg smdp "$smdp" \
            '{
              label:"Encrypted eSIM Smoke",phoneNumber:"",carrierId:$carrierId,simType:"esim",iccid:"",balance:null,currencyCode:"PHP",status:"active",activationDate:"",validUntil:"",
              identityStatus:"unknown",identityName:"",identityDocumentType:"",identityDocumentTypeCustom:"",identityDocumentNumber:"",identityCountryCode:"",identityNotes:"",notes:"",
              esimProfile:{profileStatus:"unused",source:"email",reusePolicy:"single_use",notes:"encrypted smoke profile",smdpAddress:$smdp,activationCode:$activation,confirmationCode:$confirmation,originalQrDataUrl:"data:image/png;base64,U01PS0U="}
            }' > "$tmp/sim-payload.json"

          status="$(curl -sS --max-time 10 -b "$cookies" -o "$tmp/sim.json" -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' --data-binary @"$tmp/sim-payload.json" "$base/api/sims")" || fail "eSIM creation failed"
          [ "$status" = "201" ] || fail "eSIM creation returned HTTP $status"
          sim_id="$(jq -r '.sim.id // empty' "$tmp/sim.json")"
          [ -n "$sim_id" ] || fail "eSIM id missing"
          [ "$(jq -r '.sim.esimProfile.hasActivationCode' "$tmp/sim.json")" = "true" ] || fail "eSIM summary did not report activation code"
          ! grep -Fq "$activation" "$tmp/sim.json" || fail "Create response leaked activation code"
          ! grep -Fq "$smdp" "$tmp/sim.json" || fail "Create response leaked SM-DP+ address"

          curl -fsS --max-time 10 -b "$cookies" "$base/api/sims" > "$tmp/sims.json" || fail "SIM list query failed"
          ! grep -Fq "$activation" "$tmp/sims.json" || fail "SIM list leaked activation code"
          ! grep -Fq "$smdp" "$tmp/sims.json" || fail "SIM list leaked SM-DP+ address"

          curl -fsS --max-time 10 -b "$cookies" "$base/api/esim-profiles?simId=$sim_id" > "$tmp/profile-summary.json" || fail "eSIM summary query failed"
          [ "$(jq -r '.profile.hasSmdpAddress' "$tmp/profile-summary.json")" = "true" ] || fail "SM-DP+ summary flag missing"
          [ "$(jq -r '.profile.hasLpaString' "$tmp/profile-summary.json")" = "true" ] || fail "LPA summary flag missing"
          [ "$(jq -r '.profile.hasOriginalQr' "$tmp/profile-summary.json")" = "true" ] || fail "Original QR summary flag missing"
          [ "$(jq -r 'has("secrets") or (.profile | has("secrets"))' "$tmp/profile-summary.json")" = "false" ] || fail "Summary endpoint exposed secrets"

          sync
          for dbfile in "$tmp/data/simkeeper.db" "$tmp/data/simkeeper.db-wal" "$tmp/data/simkeeper.db-shm"; do
            [ -f "$dbfile" ] || continue
            ! grep -aFq "$activation" "$dbfile" || fail "SQLite persisted plaintext activation code"
            ! grep -aFq "$confirmation" "$dbfile" || fail "SQLite persisted plaintext confirmation code"
            ! grep -aFq "$smdp" "$dbfile" || fail "SQLite persisted plaintext SM-DP+ address"
          done
          [ -f "$tmp/data/.credential-secret" ] || fail "Credential secret file missing"

          curl -fsS --max-time 10 -b "$cookies" "$base/api/esim-profiles?simId=$sim_id&reveal=1" > "$tmp/profile-reveal.json" || fail "eSIM reveal failed"
          [ "$(jq -r '.profile.secrets.activationCode' "$tmp/profile-reveal.json")" = "$activation" ] || fail "Activation code decrypt mismatch"
          [ "$(jq -r '.profile.secrets.confirmationCode' "$tmp/profile-reveal.json")" = "$confirmation" ] || fail "Confirmation code decrypt mismatch"
          [ "$(jq -r '.profile.secrets.smdpAddress' "$tmp/profile-reveal.json")" = "$smdp" ] || fail "SM-DP+ decrypt mismatch"
          [ "$(jq -r '.profile.secrets.lpaString' "$tmp/profile-reveal.json")" = "$lpa" ] || fail "Generated LPA string mismatch"

          jq -n --argjson id "$sim_id" --argjson carrierId "$carrier_id" '{
            id:$id,label:"Encrypted eSIM Smoke",phoneNumber:"",carrierId:$carrierId,simType:"esim",iccid:"",balance:null,currencyCode:"PHP",status:"active",activationDate:"",validUntil:"",
            identityStatus:"unknown",identityName:"",identityDocumentType:"",identityDocumentTypeCustom:"",identityDocumentNumber:"",identityCountryCode:"",identityNotes:"",notes:"metadata edit",
            esimProfile:{profileStatus:"installed",source:"email",reusePolicy:"single_use",notes:"metadata updated without reveal"}
          }' > "$tmp/sim-patch.json"
          status="$(curl -sS --max-time 10 -b "$cookies" -o "$tmp/sim-patch-response.json" -w '%{http_code}' \
            -X PATCH -H 'Content-Type: application/json' --data-binary @"$tmp/sim-patch.json" "$base/api/sims")" || fail "Metadata-only eSIM edit failed"
          [ "$status" = "200" ] || fail "Metadata-only eSIM edit returned HTTP $status"

          curl -fsS --max-time 10 -b "$cookies" "$base/api/esim-profiles?simId=$sim_id&reveal=1" > "$tmp/profile-after-patch.json" || fail "Reveal after metadata edit failed"
          [ "$(jq -r '.profile.secrets.activationCode' "$tmp/profile-after-patch.json")" = "$activation" ] || fail "Metadata edit overwrote activation code"
          [ "$(jq -r '.profile.profileStatus' "$tmp/profile-after-patch.json")" = "installed" ] || fail "Metadata edit did not update profile status"

          curl -fsS --max-time 10 -b "$cookies" "$base/api/backups?export=1" > "$tmp/backup.json" || fail "Portable backup export failed"
          [ "$(jq -r '.formatVersion' "$tmp/backup.json")" = "2" ] || fail "Backup format was not upgraded"
          [ -n "$(jq -r '.credentialSecret // empty' "$tmp/backup.json")" ] || fail "Portable backup missing credential key"
          [ "$(jq -r '.tables.sim_esim_profiles | length' "$tmp/backup.json")" = "1" ] || fail "Portable backup missing eSIM profile row"
          ! grep -Fq "$activation" "$tmp/backup.json" || fail "Portable backup stored plaintext activation code"

          docker rm -f "$container" >/dev/null 2>&1 || true
          start_container
          curl -fsS --max-time 10 -b "$cookies" "$base/api/esim-profiles?simId=$sim_id&reveal=1" > "$tmp/profile-after-restart.json" || fail "Reveal after container restart failed"
          [ "$(jq -r '.profile.secrets.activationCode' "$tmp/profile-after-restart.json")" = "$activation" ] || fail "Credential could not be decrypted after restart"
