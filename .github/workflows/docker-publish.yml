name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build smoke-test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: simkeeper:smoke
          build-args: |
            SIMKEEPER_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test authentication flow
        shell: bash
        run: |
          set -uo pipefail

          container="simkeeper-smoke"
          tmp="$(mktemp -d)"
          base="http://127.0.0.1:18080"
          cookies="$tmp/cookies.txt"
          headers="$tmp/headers.txt"

          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            rm -rf "$tmp"
          }
          trap cleanup EXIT

          dump_state() {
            echo "----- container logs -----"
            docker logs "$container" 2>&1 || true
            echo "----- response headers -----"
            cat "$headers" 2>/dev/null || true
            echo "----- cookie jar -----"
            cat "$cookies" 2>/dev/null || true
            for file in "$tmp"/*.html; do
              [ -f "$file" ] || continue
              echo "----- $file -----"
              head -c 4000 "$file" || true
              echo
            done
          }

          fail() {
            echo "::error::$1"
            dump_state
            exit 1
          }

          expect_header() {
            local pattern="$1"
            local description="$2"
            grep -Eiq "$pattern" "$headers" || fail "$description"
          }

          echo "[1/7] Starting disposable SIMKeeper container"
          mkdir -p "$tmp/data"
          docker run -d \
            --name "$container" \
            -p 18080:3000 \
            -e SIMKEEPER_COOKIE_SECURE=false \
            -e PUID="$(id -u)" \
            -e PGID="$(id -g)" \
            -v "$tmp/data:/app/data" \
            simkeeper:smoke >/dev/null || fail "Unable to start smoke-test container"

          echo "[2/7] Waiting for health endpoint"
          ready=0
          for _ in $(seq 1 40); do
            if curl -fsS --max-time 2 "$base/api/health" >"$tmp/health.json" 2>/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          [ "$ready" -eq 1 ] || fail "SIMKeeper did not become healthy"
          cat "$tmp/health.json"
          echo

          echo "[3/7] Verifying fresh instance setup page"
          status="$(curl -sS --max-time 5 -o "$tmp/setup.html" -w '%{http_code}' "$base/setup")" || fail "GET /setup failed"
          [ "$status" = "200" ] || fail "GET /setup returned HTTP $status"
          grep -q '创建管理员账户' "$tmp/setup.html" || fail "Fresh /setup page does not show administrator creation form"

          echo "[4/7] Creating administrator and validating session cookie"
          : > "$headers"
          curl -sS --max-time 10 -D "$headers" -o /dev/null -c "$cookies" \
            -X POST \
            --data-urlencode 'username=smokeadmin' \
            --data-urlencode 'password=smoke-test-123' \
            --data-urlencode 'confirmPassword=smoke-test-123' \
            "$base/api/auth/setup" || fail "POST /api/auth/setup failed"
          expect_header '^HTTP/[^ ]+ 303' "Setup did not return HTTP 303"
          expect_header '^location: /[[:space:]]*$' "Setup Location header is not relative root /"
          expect_header '^set-cookie: simkeeper_session=' "Setup response did not set session cookie"
          grep -q 'simkeeper_session' "$cookies" || fail "Session cookie was not written to curl cookie jar"

          echo "[5/7] Verifying authenticated Dashboard"
          status="$(curl -sS --max-time 5 -b "$cookies" -o "$tmp/dashboard.html" -w '%{http_code}' "$base/")" || fail "Authenticated GET / failed"
          [ "$status" = "200" ] || fail "Authenticated GET / returned HTTP $status"
          grep -q '你的号码生命周期' "$tmp/dashboard.html" || fail "Authenticated Dashboard content was not rendered"
          if grep -q '需要登录' "$tmp/dashboard.html" || grep -q '需要完成首次初始化' "$tmp/dashboard.html"; then
            fail "Authenticated Dashboard incorrectly rendered an auth gate"
          fi

          echo "[6/7] Logging out and verifying unauthenticated gate"
          : > "$headers"
          curl -sS --max-time 5 -D "$headers" -o /dev/null -b "$cookies" -c "$cookies" \
            -X POST "$base/api/auth/logout" || fail "POST /api/auth/logout failed"
          expect_header '^HTTP/[^ ]+ 303' "Logout did not return HTTP 303"
          expect_header '^location: /login[[:space:]]*$' "Logout Location header is not /login"

          status="$(curl -sS --max-time 5 -b "$cookies" -o "$tmp/gate.html" -w '%{http_code}' "$base/")" || fail "Unauthenticated GET / failed"
          [ "$status" = "200" ] || fail "Unauthenticated GET / returned HTTP $status"
          grep -q '需要登录' "$tmp/gate.html" || fail "Logged-out Dashboard did not render login gate"

          echo "[7/7] Logging back in and verifying Dashboard again"
          : > "$headers"
          curl -sS --max-time 10 -D "$headers" -o /dev/null -b "$cookies" -c "$cookies" \
            -X POST \
            --data-urlencode 'username=smokeadmin' \
            --data-urlencode 'password=smoke-test-123' \
            "$base/api/auth/login" || fail "POST /api/auth/login failed"
          expect_header '^HTTP/[^ ]+ 303' "Login did not return HTTP 303"
          expect_header '^location: /[[:space:]]*$' "Login Location header is not relative root /"
          expect_header '^set-cookie: simkeeper_session=' "Login response did not set session cookie"

          status="$(curl -sS --max-time 5 -b "$cookies" -o "$tmp/dashboard-after-login.html" -w '%{http_code}' "$base/")" || fail "Post-login GET / failed"
          [ "$status" = "200" ] || fail "Post-login GET / returned HTTP $status"
          grep -q '你的号码生命周期' "$tmp/dashboard-after-login.html" || fail "Dashboard was not rendered after login"

          echo "Authentication smoke test passed."

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner}/simkeeper" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push verified image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SIMKEEPER_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
