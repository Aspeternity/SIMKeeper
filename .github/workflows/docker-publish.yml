name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build smoke-test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: simkeeper:smoke
          build-args: |
            SIMKEEPER_REVISION=${{ github.sha }}
          cache-from: type=gha

      - name: Smoke test authentication flow
        shell: bash
        run: |
          set -euo pipefail

          container="simkeeper-smoke"
          tmp="$(mktemp -d)"
          base="http://127.0.0.1:18080"
          cookies="$tmp/cookies.txt"
          headers="$tmp/headers.txt"

          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            rm -rf "$tmp"
          }
          trap cleanup EXIT

          mkdir -p "$tmp/data"
          docker run -d \
            --name "$container" \
            -p 18080:3000 \
            -e SIMKEEPER_COOKIE_SECURE=false \
            -e PUID="$(id -u)" \
            -e PGID="$(id -g)" \
            -v "$tmp/data:/app/data" \
            simkeeper:smoke >/dev/null

          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS "$base/api/health" >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            docker logs "$container"
            exit 1
          fi

          status="$(curl -sS -o "$tmp/setup.html" -w '%{http_code}' "$base/setup")"
          test "$status" = "200"

          curl -sS -D "$headers" -o /dev/null -c "$cookies" \
            -X POST \
            --data-urlencode 'username=smokeadmin' \
            --data-urlencode 'password=smoke-test-123' \
            --data-urlencode 'confirmPassword=smoke-test-123' \
            "$base/api/auth/setup"

          grep -Eq '^HTTP/[^ ]+ 303' "$headers"
          grep -Eiq '^location: /[[:space:]]*$' "$headers"
          grep -Eiq '^set-cookie: simkeeper_session=' "$headers"

          status="$(curl -sS -b "$cookies" -o "$tmp/dashboard.html" -w '%{http_code}' "$base/")"
          test "$status" = "200"
          grep -q '你的号码生命周期' "$tmp/dashboard.html"

          : > "$headers"
          curl -sS -D "$headers" -o /dev/null -b "$cookies" -c "$cookies" \
            -X POST "$base/api/auth/logout"
          grep -Eq '^HTTP/[^ ]+ 303' "$headers"
          grep -Eiq '^location: /login[[:space:]]*$' "$headers"

          status="$(curl -sS -b "$cookies" -o "$tmp/gate.html" -w '%{http_code}' "$base/")"
          test "$status" = "200"
          grep -q '需要登录' "$tmp/gate.html"

          : > "$headers"
          curl -sS -D "$headers" -o /dev/null -b "$cookies" -c "$cookies" \
            -X POST \
            --data-urlencode 'username=smokeadmin' \
            --data-urlencode 'password=smoke-test-123' \
            "$base/api/auth/login"
          grep -Eq '^HTTP/[^ ]+ 303' "$headers"
          grep -Eiq '^location: /[[:space:]]*$' "$headers"
          grep -Eiq '^set-cookie: simkeeper_session=' "$headers"

          status="$(curl -sS -b "$cookies" -o "$tmp/dashboard-after-login.html" -w '%{http_code}' "$base/")"
          test "$status" = "200"
          grep -q '你的号码生命周期' "$tmp/dashboard-after-login.html"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner}/simkeeper" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SIMKEEPER_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
