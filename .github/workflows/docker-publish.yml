name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build smoke-test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: simkeeper:smoke
          build-args: |
            SIMKEEPER_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test application flows
        shell: bash
        run: |
          set -uo pipefail

          container="simkeeper-smoke"
          tmp="$(mktemp -d)"
          base="http://127.0.0.1:18080"
          cookies="$tmp/cookies.txt"
          headers="$tmp/headers.txt"

          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            rm -rf "$tmp"
          }
          trap cleanup EXIT

          dump_state() {
            echo "----- container logs -----"
            docker logs "$container" 2>&1 || true
            echo "----- response headers -----"
            cat "$headers" 2>/dev/null || true
            echo "----- cookie jar -----"
            cat "$cookies" 2>/dev/null || true
            for file in "$tmp"/*.html "$tmp"/*.json; do
              [ -f "$file" ] || continue
              echo "----- $file -----"
              head -c 10000 "$file" || true
              echo
            done
          }

          fail() {
            echo "::error::$1"
            dump_state
            exit 1
          }

          expect_header() {
            local pattern="$1"
            local description="$2"
            grep -Eiq "$pattern" "$headers" || fail "$description"
          }

          echo "[1/17] Starting disposable SIMKeeper container"
          mkdir -p "$tmp/data"
          docker run -d \
            --name "$container" \
            -p 18080:3000 \
            -e SIMKEEPER_COOKIE_SECURE=false \
            -e PUID="$(id -u)" \
            -e PGID="$(id -g)" \
            -v "$tmp/data:/app/data" \
            simkeeper:smoke >/dev/null || fail "Unable to start smoke-test container"

          echo "[2/17] Waiting for health endpoint"
          ready=0
          for _ in $(seq 1 40); do
            if curl -fsS --max-time 2 "$base/api/health" >"$tmp/health.json" 2>/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          [ "$ready" -eq 1 ] || fail "SIMKeeper did not become healthy"

          echo "[3/17] Verifying fresh instance setup page"
          status="$(curl -sS --max-time 5 -o "$tmp/setup.html" -w '%{http_code}' "$base/setup")" || fail "GET /setup failed"
          [ "$status" = "200" ] || fail "GET /setup returned HTTP $status"
          grep -q '创建管理员账户' "$tmp/setup.html" || fail "Fresh /setup page does not show administrator creation form"

          echo "[4/17] Creating administrator and validating session cookie"
          : > "$headers"
          curl -sS --max-time 10 -D "$headers" -o /dev/null -c "$cookies" \
            -X POST \
            --data-urlencode 'username=smokeadmin' \
            --data-urlencode 'password=smoke-test-123' \
            --data-urlencode 'confirmPassword=smoke-test-123' \
            "$base/api/auth/setup" || fail "POST /api/auth/setup failed"
          expect_header '^HTTP/[^ ]+ 303' "Setup did not return HTTP 303"
          expect_header '^location: /[[:space:]]*$' "Setup Location header is not relative root /"
          expect_header '^set-cookie: simkeeper_session=' "Setup response did not set session cookie"
          grep -q 'simkeeper_session' "$cookies" || fail "Session cookie was not written to curl cookie jar"

          echo "[5/17] Verifying authenticated Dashboard"
          status="$(curl -sS --max-time 5 -b "$cookies" -o "$tmp/dashboard.html" -w '%{http_code}' "$base/")" || fail "Authenticated GET / failed"
          [ "$status" = "200" ] || fail "Authenticated GET / returned HTTP $status"
          grep -q '你的号码生命周期' "$tmp/dashboard.html" || fail "Authenticated Dashboard content was not rendered"
          grep -q 'aria-label="打开导航"' "$tmp/dashboard.html" || fail "Mobile navigation trigger was not rendered"
          grep -q 'data-page-title="概览"' "$tmp/dashboard.html" || fail "Dashboard top bar did not render the current page title"
          grep -q 'data-reminder-count="0"' "$tmp/dashboard.html" || fail "Empty reminder count was not rendered"

          echo "[6/17] Logging out and verifying unauthenticated gate"
          : > "$headers"
          curl -sS --max-time 5 -D "$headers" -o /dev/null -b "$cookies" -c "$cookies" -X POST "$base/api/auth/logout" || fail "POST /api/auth/logout failed"
          expect_header '^HTTP/[^ ]+ 303' "Logout did not return HTTP 303"
          expect_header '^location: /login[[:space:]]*$' "Logout Location header is not /login"
          status="$(curl -sS --max-time 5 -b "$cookies" -o "$tmp/gate.html" -w '%{http_code}' "$base/")" || fail "Unauthenticated GET / failed"
          [ "$status" = "200" ] || fail "Unauthenticated GET / returned HTTP $status"
          grep -q '需要登录' "$tmp/gate.html" || fail "Logged-out Dashboard did not render login gate"

          echo "[7/17] Logging back in"
          : > "$headers"
          curl -sS --max-time 10 -D "$headers" -o /dev/null -b "$cookies" -c "$cookies" \
            -X POST \
            --data-urlencode 'username=smokeadmin' \
            --data-urlencode 'password=smoke-test-123' \
            "$base/api/auth/login" || fail "POST /api/auth/login failed"
          expect_header '^HTTP/[^ ]+ 303' "Login did not return HTTP 303"
          expect_header '^location: /[[:space:]]*$' "Login Location header is not relative root /"
          expect_header '^set-cookie: simkeeper_session=' "Login response did not set session cookie"

          echo "[8/17] Creating Hong Kong carrier"
          status="$(curl -sS --max-time 10 -b "$cookies" -o "$tmp/carrier.json" -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            --data '{"name":"Smoke HK Carrier","countryCode":"HK","website":"","notes":""}' \
            "$base/api/carriers")" || fail "POST /api/carriers failed"
          [ "$status" = "201" ] || fail "Carrier creation returned HTTP $status"
          carrier_id="$(jq -r '.carrier.id // empty' "$tmp/carrier.json")"
          [ -n "$carrier_id" ] || fail "Carrier response did not contain an id"

          echo "[9/17] Creating SIM with normalized phone number"
          jq -n --argjson carrierId "$carrier_id" '{label:"Smoke SIM",phoneNumber:"51234567",carrierId:$carrierId,simType:"esim",iccid:"",balance:"",currencyCode:"HKD",status:"active",activationDate:"",validUntil:"",notes:""}' > "$tmp/sim-payload.json"
          status="$(curl -sS --max-time 10 -b "$cookies" -o "$tmp/sim.json" -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' --data-binary @"$tmp/sim-payload.json" "$base/api/sims")" || fail "POST /api/sims failed"
          [ "$status" = "201" ] || fail "SIM creation returned HTTP $status"
          sim_id="$(jq -r '.sim.id // empty' "$tmp/sim.json")"
          [ -n "$sim_id" ] || fail "SIM response did not contain an id"
          [ "$(jq -r '.sim.phoneNumber' "$tmp/sim.json")" = "+85251234567" ] || fail "SIM phone number was not normalized to E.164"

          echo "[10/17] Saving tariff profile with advanced and custom data"
          jq -n --argjson simId "$sim_id" '{
            simId:$simId,
            planName:"Conditional Smoke Tariff",
            planType:"prepaid",
            currencyCode:"HKD",
            purchaseCost:68,
            recurringFee:null,
            recurringPeriodValue:null,
            recurringPeriodUnit:"",
            administrationFee:3,
            autoRenew:"unknown",
            roamingAvailable:"yes",
            rates:{
              localIncomingSms:{mode:"free",amount:null,billingUnit:""},
              localData:{mode:"charged",amount:1,billingUnit:"per_100mb"},
              roamingIncomingSms:{mode:"unknown",amount:null,billingUnit:""}
            },
            rules:{
              localOutgoingSms:[
                {label:"Same network",mode:"charged",amount:0.3,billingUnit:"per_sms",packagePrice:null,packageAllowanceAmount:null,packageAllowanceUnit:"",validityValue:null,validityUnit:"",autoRenew:"unknown",conditions:[{type:"network_scope",value:"same_network",value2:""}]},
                {label:"Other network",mode:"charged",amount:0.7,billingUnit:"per_sms",packagePrice:null,packageAllowanceAmount:null,packageAllowanceUnit:"",validityValue:null,validityUnit:"",autoRenew:"unknown",conditions:[{type:"network_scope",value:"other_network",value2:""}]}
              ],
              localData:[
                {label:"Global 1GB local pass",mode:"package",amount:null,billingUnit:"",packagePrice:28,packageAllowanceAmount:1,packageAllowanceUnit:"gb",validityValue:365,validityUnit:"day",autoRenew:"no",conditions:[]}
              ],
              internationalOutgoingSms:[
                {label:"Mainland China",mode:"charged",amount:1.5,billingUnit:"per_sms",packagePrice:null,packageAllowanceAmount:null,packageAllowanceUnit:"",validityValue:null,validityUnit:"",autoRenew:"unknown",conditions:[{type:"destination",value:"CN",value2:""}]},
                {label:"Other destinations",mode:"charged",amount:1.8,billingUnit:"per_sms",packagePrice:null,packageAllowanceAmount:null,packageAllowanceUnit:"",validityValue:null,validityUnit:"",autoRenew:"unknown",conditions:[{type:"destination",value:"OTHER",value2:""}]}
              ],
              roamingOutgoingCall:[
                {label:"China to home or local",mode:"charged",amount:3,billingUnit:"per_minute",packagePrice:null,packageAllowanceAmount:null,packageAllowanceUnit:"",validityValue:null,validityUnit:"",autoRenew:"unknown",conditions:[{type:"roaming_region",value:"CN",value2:""},{type:"destination",value:"HOME",value2:""},{type:"destination",value:"CURRENT",value2:""}]},
                {label:"China to other destinations",mode:"charged",amount:18,billingUnit:"per_minute",packagePrice:null,packageAllowanceAmount:null,packageAllowanceUnit:"",validityValue:null,validityUnit:"",autoRenew:"unknown",conditions:[{type:"roaming_region",value:"CN",value2:""},{type:"destination",value:"OTHER",value2:""}]}
              ],
              roamingIncomingSms:[
                {label:"China or Macau",mode:"free",amount:null,billingUnit:"",packagePrice:null,packageAllowanceAmount:null,packageAllowanceUnit:"",validityValue:null,validityUnit:"",autoRenew:"unknown",conditions:[{type:"roaming_region",value:"CN",value2:""},{type:"roaming_region",value:"MO",value2:""}]}
              ],
              roamingData:[
                {label:"2GB 365-day pass",mode:"package",amount:null,billingUnit:"",packagePrice:30,packageAllowanceAmount:2,packageAllowanceUnit:"gb",validityValue:365,validityUnit:"day",autoRenew:"no",conditions:[{type:"roaming_region",value:"CN",value2:""},{type:"roaming_region",value:"MO",value2:""}]}
              ]
            },
            customItems:[
              {label:"Voicemail",kind:"call",mode:"charged",amount:0.2,billingUnit:"per_call",notes:"Custom tariff smoke test"}
            ],
            usageSummary:"Smoke-test tariff profile",
            sourceUrl:"",
            verifiedAt:"",
            notes:""
          }' > "$tmp/tariff-payload.json"
          status="$(curl -sS --max-time 10 -b "$cookies" -o "$tmp/tariff.json" -w '%{http_code}' \
            -X PUT -H 'Content-Type: application/json' --data-binary @"$tmp/tariff-payload.json" "$base/api/tariffs")" || fail "PUT /api/tariffs failed"
          [ "$status" = "200" ] || fail "Tariff save returned HTTP $status"
          [ "$(jq -r '.tariff.currencyCode' "$tmp/tariff.json")" = "HKD" ] || fail "Tariff currency was not saved"
          [ "$(jq -r '.tariff.purchaseCost' "$tmp/tariff.json")" = "68" ] || fail "SIM purchase cost was not saved"
          [ "$(jq -r '.tariff.localIncomingSmsPolicy' "$tmp/tariff.json")" = "free" ] || fail "Base incoming SMS policy was not derived"
          [ "$(jq -r '.tariff.rates.localData.amount' "$tmp/tariff.json")" = "1" ] || fail "Per-100MB local data amount was not saved"
          [ "$(jq -r '.tariff.rates.localData.billingUnit' "$tmp/tariff.json")" = "per_100mb" ] || fail "Per-100MB local data billing unit was not saved"
          [ "$(jq -r '.tariff.roamingIncomingSmsPolicy' "$tmp/tariff.json")" = "variable" ] || fail "Conditional roaming SMS policy was not marked variable"
          [ "$(jq -r '.tariff.rules.localOutgoingSms | length' "$tmp/tariff.json")" = "2" ] || fail "Local SMS conditional rules were not saved"
          [ "$(jq -r '.tariff.rules.localData[0].conditions | length' "$tmp/tariff.json")" = "0" ] || fail "Unconditional local pass unexpectedly gained conditions"
          [ "$(jq -r '.tariff.rules.roamingOutgoingCall[0].conditions | length' "$tmp/tariff.json")" = "3" ] || fail "Multi-condition roaming call rule was not saved"
          [ "$(jq -r '.tariff.rules.roamingData[0].packagePrice' "$tmp/tariff.json")" = "30" ] || fail "Roaming data pass price was not saved"
          [ "$(jq -r '.tariff.customItems | length' "$tmp/tariff.json")" = "1" ] || fail "Custom tariff item was not saved"
          [ "$(jq -r '.tariff.customItems[0].billingUnit' "$tmp/tariff.json")" = "per_call" ] || fail "Custom tariff billing unit was not saved"

          echo "[11/17] Verifying tariff summary is joined into SIM list"
          status="$(curl -sS --max-time 10 -b "$cookies" -o "$tmp/sims.json" -w '%{http_code}' "$base/api/sims")" || fail "GET /api/sims failed"
          [ "$status" = "200" ] || fail "SIM list returned HTTP $status"
          [ "$(jq -r --argjson id "$sim_id" '.sims[] | select(.id == $id) | .tariffPlanName' "$tmp/sims.json")" = "Conditional Smoke Tariff" ] || fail "SIM list did not include tariff summary"
          [ "$(jq -r --argjson id "$sim_id" '.sims[] | select(.id == $id) | .roamingIncomingSmsPolicy' "$tmp/sims.json")" = "variable" ] || fail "SIM list did not include conditional roaming SMS summary"

          echo "[12/17] Creating multiple keep-alive rules"
          jq -n --argjson simId "$sim_id" '{simId:$simId,name:"Recharge validity",intervalValue:365,intervalUnit:"day",qualifyingActions:["recharge"],nextDueDate:"2026-09-30",warningDays:30,gracePeriodDays:0,enabled:true,notes:"Recharge should advance this rule"}' > "$tmp/keepalive-rule1.json"
          status="$(curl -sS --max-time 10 -b "$cookies" -o "$tmp/keepalive-rule1-response.json" -w '%{http_code}' -X PUT -H 'Content-Type: application/json' --data-binary @"$tmp/keepalive-rule1.json" "$base/api/keep-alive")" || fail "PUT first keep-alive rule failed"
          [ "$status" = "200" ] || fail "First keep-alive rule returned HTTP $status"
          rule1_id="$(jq -r '.rule.id // empty' "$tmp/keepalive-rule1-response.json")"
          [ -n "$rule1_id" ] || fail "First keep-alive rule did not return an id"

          jq -n --argjson simId "$sim_id" '{simId:$simId,name:"Usage activity",intervalValue:90,intervalUnit:"day",qualifyingActions:["outgoing_sms"],nextDueDate:"2026-09-10",warningDays:14,gracePeriodDays:7,enabled:true,notes:"Recharge must not advance this rule"}' > "$tmp/keepalive-rule2.json"
          status="$(curl -sS --max-time 10 -b "$cookies" -o "$tmp/keepalive-rule2-response.json" -w '%{http_code}' -X PUT -H 'Content-Type: application/json' --data-binary @"$tmp/keepalive-rule2.json" "$base/api/keep-alive")" || fail "PUT second keep-alive rule failed"
          [ "$status" = "200" ] || fail "Second keep-alive rule returned HTTP $status"
          rule2_id="$(jq -r '.rule.id // empty' "$tmp/keepalive-rule2-response.json")"
          [ -n "$rule2_id" ] || fail "Second keep-alive rule did not return an id"

          echo "[13/17] Recording qualifying recharge and verifying automatic advancement"
          jq -n --argjson simId "$sim_id" '{simId:$simId,activityType:"recharge",activityDate:"2026-09-03",amount:20,currencyCode:"HKD",balanceAfter:62,validUntilAfter:"2027-09-03",notes:"Keep-alive smoke recharge"}' > "$tmp/keepalive-event.json"
          status="$(curl -sS --max-time 10 -b "$cookies" -o "$tmp/keepalive-event-response.json" -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data-binary @"$tmp/keepalive-event.json" "$base/api/keep-alive")" || fail "POST keep-alive event failed"
          [ "$status" = "201" ] || fail "Keep-alive event returned HTTP $status"
          [ "$(jq -r '.advancedRuleIds | length' "$tmp/keepalive-event-response.json")" = "1" ] || fail "Recharge did not advance exactly one matching rule"
          [ "$(jq -r --argjson id "$rule1_id" '.rules[] | select(.id == $id) | .nextDueDate' "$tmp/keepalive-event-response.json")" = "2027-09-03" ] || fail "Recharge rule next due date was not advanced by 365 days"
          [ "$(jq -r --argjson id "$rule2_id" '.rules[] | select(.id == $id) | .nextDueDate' "$tmp/keepalive-event-response.json")" = "2026-09-10" ] || fail "Non-matching usage rule was unexpectedly changed"
          [ "$(jq -r '.sim.balance' "$tmp/keepalive-event-response.json")" = "62" ] || fail "Activity-after balance was not synchronized to SIM"
          [ "$(jq -r '.sim.validUntil' "$tmp/keepalive-event-response.json")" = "2027-09-03" ] || fail "Activity-after validity was not synchronized to SIM"
          [ "$(jq -r '.events[0].activityType' "$tmp/keepalive-event-response.json")" = "recharge" ] || fail "Keep-alive event was not returned in history"

          status="$(curl -sS --max-time 10 -b "$cookies" -o "$tmp/keepalive-list.json" -w '%{http_code}' "$base/api/keep-alive")" || fail "GET /api/keep-alive failed"
          [ "$status" = "200" ] || fail "Keep-alive list returned HTTP $status"
          [ "$(jq -r --argjson id "$sim_id" '.sims[] | select(.id == $id) | .rules | length' "$tmp/keepalive-list.json")" = "2" ] || fail "Keep-alive overview did not include both rules"
          [ "$(jq -r --argjson id "$sim_id" '.sims[] | select(.id == $id) | .latestEvent.activityType' "$tmp/keepalive-list.json")" = "recharge" ] || fail "Keep-alive overview did not include latest activity"

          echo "[14/17] Creating and verifying bound service"
          jq -n --argjson simId "$sim_id" '{simId:$simId,serviceName:"Smoke Bank",category:"finance",bindingType:"two_factor",accountIdentifier:"smoke-account-01",importance:"critical",status:"active",website:"https://example.com",boundAt:"2026-09-01",verifiedAt:"2026-09-03",notes:"Bound service smoke test"}' > "$tmp/service-payload.json"
          status="$(curl -sS --max-time 10 -b "$cookies" -o "$tmp/service.json" -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data-binary @"$tmp/service-payload.json" "$base/api/services")" || fail "POST /api/services failed"
          [ "$status" = "201" ] || fail "Bound service creation returned HTTP $status"
          service_id="$(jq -r '.binding.id // empty' "$tmp/service.json")"
          [ -n "$service_id" ] || fail "Bound service response did not contain an id"
          [ "$(jq -r '.binding.importance' "$tmp/service.json")" = "critical" ] || fail "Bound service importance was not saved"
          [ "$(jq -r '.binding.bindingType' "$tmp/service.json")" = "two_factor" ] || fail "Bound service binding type was not saved"

          status="$(curl -sS --max-time 10 -b "$cookies" -o "$tmp/services-api.json" -w '%{http_code}' "$base/api/services?simId=$sim_id")" || fail "GET /api/services?simId failed"
          [ "$status" = "200" ] || fail "Bound services by SIM returned HTTP $status"
          [ "$(jq -r '.bindings | length' "$tmp/services-api.json")" = "1" ] || fail "Bound service was not returned by SIM"
          [ "$(jq -r '.bindings[0].serviceName' "$tmp/services-api.json")" = "Smoke Bank" ] || fail "Bound service name was not returned"

          status="$(curl -sS --max-time 10 -b "$cookies" -o "$tmp/services.html" -w '%{http_code}' "$base/services")" || fail "GET /services failed"
          [ "$status" = "200" ] || fail "Bound services page returned HTTP $status"
          grep -q '绑定服务' "$tmp/services.html" || fail "Bound services page heading was not rendered"

          echo "[15/17] Exporting and creating full backups"
          status="$(curl -sS --max-time 10 -b "$cookies" -o "$tmp/export.json" -w '%{http_code}' "$base/api/backups?export=1")" || fail "GET portable backup export failed"
          [ "$status" = "200" ] || fail "Portable backup export returned HTTP $status"
          [ "$(jq -r '.format' "$tmp/export.json")" = "simkeeper-portable-backup" ] || fail "Portable backup format marker is missing"
          [ "$(jq -r '.tables.sim_cards | length' "$tmp/export.json")" = "1" ] || fail "Portable backup did not include SIM data"
          [ "$(jq -r '.tables.sim_bound_services | length' "$tmp/export.json")" = "1" ] || fail "Portable backup did not include bound services"

          status="$(curl -sS --max-time 10 -b "$cookies" -o "$tmp/local-backup.json" -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"action":"create"}' "$base/api/backups")" || fail "POST local backup creation failed"
          [ "$status" = "201" ] || fail "Local backup creation returned HTTP $status"
          backup_name="$(jq -r '.backup.name // empty' "$tmp/local-backup.json")"
          [ -n "$backup_name" ] || fail "Local backup did not return a filename"

          status="$(curl -sS --max-time 10 -b "$cookies" -o "$tmp/backups-list.json" -w '%{http_code}' "$base/api/backups")" || fail "GET backup list failed"
          [ "$status" = "200" ] || fail "Backup list returned HTTP $status"
          [ "$(jq -r '.backups | length' "$tmp/backups-list.json")" -ge 1 ] || fail "Created local backup was not listed"

          echo "[16/17] Mutating data and verifying full restore rollback"
          status="$(curl -sS --max-time 10 -b "$cookies" -o "$tmp/temp-carrier.json" -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"name":"Temporary Restore Probe","countryCode":"SG","website":"","notes":"must disappear after restore"}' "$base/api/carriers")" || fail "Creating restore probe carrier failed"
          [ "$status" = "201" ] || fail "Restore probe carrier returned HTTP $status"

          jq -n --slurpfile backup "$tmp/export.json" '{action:"restoreImported",backup:$backup[0]}' > "$tmp/restore-payload.json"
          status="$(curl -sS --max-time 20 -b "$cookies" -o "$tmp/restore.json" -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data-binary @"$tmp/restore-payload.json" "$base/api/backups")" || fail "Portable backup restore failed"
          [ "$status" = "200" ] || fail "Portable backup restore returned HTTP $status"
          [ -n "$(jq -r '.safetyBackup // empty' "$tmp/restore.json")" ] || fail "Restore did not create a pre-restore safety backup"

          status="$(curl -sS --max-time 10 -b "$cookies" -o "$tmp/carriers-after-restore.json" -w '%{http_code}' "$base/api/carriers")" || fail "GET carriers after restore failed"
          [ "$status" = "200" ] || fail "Carrier list after restore returned HTTP $status"
          [ "$(jq -r '[.carriers[] | select(.name == "Temporary Restore Probe")] | length' "$tmp/carriers-after-restore.json")" = "0" ] || fail "Restore probe data survived the restore"
          [ "$(jq -r '[.carriers[] | select(.name == "Smoke HK Carrier")] | length' "$tmp/carriers-after-restore.json")" = "1" ] || fail "Original carrier was not restored"

          status="$(curl -sS --max-time 10 -b "$cookies" -o "$tmp/services-after-restore.json" -w '%{http_code}' "$base/api/services?simId=$sim_id")" || fail "GET bound services after restore failed"
          [ "$status" = "200" ] || fail "Bound services after restore returned HTTP $status"
          [ "$(jq -r '.bindings[0].serviceName' "$tmp/services-after-restore.json")" = "Smoke Bank" ] || fail "Bound service was not restored"

          echo "[17/17] Verifying reminder and settings pages"
          status="$(curl -sS --max-time 10 -b "$cookies" -o "$tmp/reminders.html" -w '%{http_code}' "$base/reminders")" || fail "GET /reminders failed"
          [ "$status" = "200" ] || fail "Reminder center returned HTTP $status"
          grep -q '提醒中心' "$tmp/reminders.html" || fail "Reminder center heading was not rendered"
          grep -q 'Usage activity' "$tmp/reminders.html" || fail "Due keep-alive rule was not rendered in reminder center"
          grep -q 'data-page-title="提醒中心"' "$tmp/reminders.html" || fail "Reminder top bar title was not synchronized with the route"
          grep -Eq 'data-reminder-count="[1-9][0-9]*"' "$tmp/reminders.html" || fail "Pending reminder count was not rendered in the top bar"

          status="$(curl -sS --max-time 10 -b "$cookies" -o "$tmp/settings.html" -w '%{http_code}' "$base/settings")" || fail "GET /settings failed"
          [ "$status" = "200" ] || fail "Settings and backup page returned HTTP $status"
          grep -q '设置与备份' "$tmp/settings.html" || fail "Settings and backup heading was not rendered"
          grep -q 'data-page-title="设置与备份"' "$tmp/settings.html" || fail "Settings top bar title was not synchronized with the route"

          echo "Application smoke test passed."

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner}/simkeeper" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push verified image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SIMKEEPER_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
